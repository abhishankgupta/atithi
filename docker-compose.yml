# Local development services. Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: atithi
      POSTGRES_USER: atithi
      POSTGRES_PASSWORD: atithi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atithi -d atithi"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage standing in for Cloudflare R2 (used once photo uploads land in step 6).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atithi
      MINIO_ROOT_PASSWORD: atithi-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
